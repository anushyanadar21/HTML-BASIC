<!DOCTYPE html>
<html>
<head>
	<title>Food Categories</title>
</head>
<body>
	<h4>Food Categories</h4>
	<ul>
		<li>Fruits</li>
		<ul type="circle">
		       <li>Citrus</li>
				<ul type="square">
				      <li>Orange</li>
				      <li>Lemon</li>
				      <li>Mosambi</li><br>
				</ul>
		       <li>Berries</li>
				<ul type="square">
					<li>Strawberry</li>
					<li>Blueberry</li>
					<li>Raspberry</li><br>
				</ul>
		</ul>
		<li>Vegetables</li>
			<ul type="circle">
				<li>Leafy</li>
					<ul type="square">
						<li>Spinach</li>
						<li>Cabbage</li><br>
					</ul>
				<li>Root</li>
					<ul type="square">
						<li>Carrot</li>
						<li>Beetroot</li>
					</ul>
			</ul>
	</ul>
</body>
</html>
